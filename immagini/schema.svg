<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1600" height="1010" fill="#f3f5f1"/><defs><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17211d"/></marker></defs><text x="80" y="70" font-family="Inter" font-size="18" font-weight="400" text-anchor="start" fill="#54625b" letter-spacing="4">PROGETTO DEI CERCHI</text><text x="80" y="118" font-family="TeX Gyre Pagella" font-size="44" font-weight="400" text-anchor="start" fill="#17211d" >Come è fatto</text><text x="80" y="180" font-family="Inter" font-size="20" font-weight="600" text-anchor="start" fill="#17211d" >1 · Dalla persona al pianeta</text><text x="80" y="206" font-family="Inter" font-size="16" font-weight="400" text-anchor="start" fill="#54625b" >Cinque livelli. Nessuno comanda quello sotto: ogni decisione resta al livello più vicino che può prenderla.</text><circle cx="170" cy="406" r="14" fill="#c98f1c" fill-opacity="1" stroke="#c98f1c" stroke-width="2"/><text x="170" y="412" font-family="Inter" font-size="13" font-weight="700" text-anchor="middle" fill="#17211d" >0</text><text x="170" y="454" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Nucleo di cura</text><text x="170" y="478" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#54625b" >da 1 a 15 persone</text><text x="170" y="504" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >cura quotidiana</text><text x="170" y="524" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >e ospitalità</text><line x1="200" y1="408" x2="390" y2="408" stroke="#17211d" stroke-width="1.5" marker-end="url(#fr)"/><text x="295.0" y="398" font-family="Inter" font-size="13" font-weight="400" text-anchor="middle" fill="#54625b" >si federa in</text><circle cx="440" cy="386" r="34" fill="#0e6656" fill-opacity=".14" stroke="#0e6656" stroke-width="2"/><text x="440" y="392" font-family="Inter" font-size="18" font-weight="700" text-anchor="middle" fill="#17211d" >1</text><text x="440" y="454" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Comunità di base</text><text x="440" y="478" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#54625b" >di norma 30–500 persone</text><text x="440" y="504" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >decide in Assemblea,</text><text x="440" y="524" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >gestisce lavoro e Magazzino</text><line x1="490" y1="408" x2="666" y2="408" stroke="#17211d" stroke-width="1.5" marker-end="url(#fr)"/><text x="578.0" y="398" font-family="Inter" font-size="13" font-weight="400" text-anchor="middle" fill="#54625b" >si federa in</text><circle cx="740" cy="362" r="58" fill="#0e6656" fill-opacity=".14" stroke="#0e6656" stroke-width="2"/><text x="740" y="368" font-family="Inter" font-size="18" font-weight="700" text-anchor="middle" fill="#17211d" >2</text><text x="740" y="454" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Bacino</text><text x="740" y="478" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#54625b" >di norma almeno 3 Comunità</text><text x="740" y="504" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >logistica, ospedale,</text><text x="740" y="524" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >Tribunale di Garanzia</text><line x1="814" y1="408" x2="960" y2="408" stroke="#17211d" stroke-width="1.5" marker-end="url(#fr)"/><text x="887.0" y="398" font-family="Inter" font-size="13" font-weight="400" text-anchor="middle" fill="#54625b" >si federa in</text><circle cx="1060" cy="336" r="84" fill="#0e6656" fill-opacity=".14" stroke="#0e6656" stroke-width="2"/><text x="1060" y="342" font-family="Inter" font-size="18" font-weight="700" text-anchor="middle" fill="#17211d" >3</text><text x="1060" y="454" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Bioregione</text><text x="1060" y="478" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#54625b" >più Bacini</text><text x="1060" y="504" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >ferrovie, energia,</text><text x="1060" y="524" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >alta specializzazione</text><line x1="1160" y1="408" x2="1272" y2="408" stroke="#17211d" stroke-width="1.5" marker-end="url(#fr)"/><text x="1216.0" y="398" font-family="Inter" font-size="13" font-weight="400" text-anchor="middle" fill="#54625b" >si federa in</text><circle cx="1400" cy="308" r="112" fill="#0e6656" fill-opacity=".14" stroke="#0e6656" stroke-width="2"/><text x="1400" y="314" font-family="Inter" font-size="18" font-weight="700" text-anchor="middle" fill="#17211d" >4</text><text x="1400" y="454" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Cerchio globale</text><text x="1400" y="478" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#54625b" >l’intera umanità</text><text x="1400" y="504" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >regole tecniche comuni,</text><text x="1400" y="524" font-family="Inter" font-size="15" font-weight="400" text-anchor="middle" fill="#17211d" >nessun governo</text><line x1="80" y1="560" x2="1520" y2="560" stroke="#54625b" stroke-width="1" opacity=".4"/><text x="80" y="600" font-family="Inter" font-size="20" font-weight="600" text-anchor="start" fill="#17211d" >2 · Dal bisogno al compito</text><text x="80" y="626" font-family="Inter" font-size="16" font-weight="400" text-anchor="start" fill="#54625b" >Come funziona una Comunità: si parte da ciò che serve, non dal lavoro da assegnare.</text><rect x="80" y="770" width="220" height="92" rx="10" fill="#f3f5f1" fill-opacity="1" stroke="#17211d" stroke-width="1.5"/><text x="190.0" y="802" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Bisogni</text><text x="190.0" y="826" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >ciò che serve</text><text x="190.0" y="845" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >alle persone</text><rect x="385" y="770" width="220" height="92" rx="10" fill="#0e6656" fill-opacity=".14" stroke="#0e6656" stroke-width="2.5"/><text x="495.0" y="802" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Assemblea</text><text x="495.0" y="826" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >tutte le persone,</text><text x="495.0" y="845" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >un voto a testa</text><rect x="690" y="770" width="220" height="92" rx="10" fill="#f3f5f1" fill-opacity="1" stroke="#17211d" stroke-width="1.5"/><text x="800.0" y="802" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Lavoro necessario</text><text x="800.0" y="826" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >a rotazione, non oltre</text><text x="800.0" y="845" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >15 ore a settimana in media</text><rect x="995" y="770" width="220" height="92" rx="10" fill="#f3f5f1" fill-opacity="1" stroke="#17211d" stroke-width="1.5"/><text x="1105.0" y="802" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Magazzini comuni</text><text x="1105.0" y="826" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >beni e servizi</text><text x="1105.0" y="845" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >di tutti</text><rect x="1300" y="770" width="220" height="92" rx="10" fill="#f3f5f1" fill-opacity="1" stroke="#17211d" stroke-width="1.5"/><text x="1410.0" y="802" font-family="Inter" font-size="18" font-weight="600" text-anchor="middle" fill="#17211d" >Accesso</text><text x="1410.0" y="826" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >a ciascuno</text><text x="1410.0" y="845" font-family="Inter" font-size="14" font-weight="400" text-anchor="middle" fill="#54625b" >secondo il bisogno</text><line x1="306" y1="816.0" x2="377" y2="816.0" stroke="#17211d" stroke-width="1.5" marker-end="url(#fr)"/><text x="341.5" y="806.0" font-family="Inter" font-size="13" font-weight="400" text-anchor="middle" fill="#54625b" >si rilevano</text><line x1="611" y1="816.0" x2="682" y2="816.0" stroke="#17211d" stroke-width="1.5" marker-end="url(#fr)"/><text x="646.5" y="806.0" font-family="Inter" font-size="13" font-weight="400" text-anchor="middle" fill="#54625b" >decide</text><line x1="916" y1="816.0" x2="987" y2="816.0" stroke="#17211d" stroke-width="1.5" marker-end="url(#fr)"/><text x="951.5" y="806.0" font-family="Inter" font-size="13" font-weight="400" text-anchor="middle" fill="#54625b" >produce</text><line x1="1221" y1="816.0" x2="1292" y2="816.0" stroke="#17211d" stroke-width="1.5" marker-end="url(#fr)"/><text x="1256.5" y="806.0" font-family="Inter" font-size="13" font-weight="400" text-anchor="middle" fill="#54625b" >distribuisce</text><polyline points="1410.0,868 1410.0,918 190.0,918 190.0,872" fill="none" stroke="#17211d" stroke-width="1.5" marker-end="url(#fr)"/><text x="800.0" y="908" font-family="Inter" font-size="13" font-weight="400" text-anchor="middle" fill="#54625b" >nascono nuovi bisogni, e il ciclo ricomincia</text><line x1="425.0" y1="718" x2="465.0" y2="762" stroke="#17211d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fr)"/><text x="415.0" y="692" font-family="Inter" font-size="15" font-weight="600" text-anchor="end" fill="#17211d" >Consigli tecnici e IA</text><text x="415.0" y="712" font-family="Inter" font-size="14" font-weight="400" text-anchor="end" fill="#54625b" >propongono e calcolano, non decidono</text><line x1="565.0" y1="718" x2="525.0" y2="762" stroke="#17211d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fr)"/><text x="575.0" y="692" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#17211d" >Cerchio di Garanzia</text><text x="575.0" y="712" font-family="Inter" font-size="14" font-weight="400" text-anchor="start" fill="#54625b" >controlla e riceve i ricorsi; incarichi a sorteggio, brevi</text></svg>