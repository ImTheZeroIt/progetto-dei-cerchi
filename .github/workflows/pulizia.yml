name: Pulizia della radice

on:
  push:
    paths:
      - ".github/workflows/pulizia.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulizia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Togli dalla radice i file caricati per errore
        run: |
          tieni="CHANGELOG.md CONTRIBUER.md CONTRIBUIR.md CONTRIBUIRE.md CONTRIBUTING.md DOMANDE.md LICENSE.md MODIFICATIONS.md PARAMETRI.md PREGUNTAS.md PROPOSTE.md QUESTIONS.md README.en.md README.es.md README.fr.md README.md REGISTRO-DELLE-MODIFICHE.md REPONSES.md VERIFICA-COERENZA.md VERIFICA-PROPOSTE.md"
          for f in *; do
            [ -f "$f" ] || continue
            case " $tieni " in *" $f "*) continue ;; esac
            git rm -q -- "$f"
          done
          git rm -q .github/workflows/pulizia.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Tolti i file caricati per errore nella radice"
          git push
